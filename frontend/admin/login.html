<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHURA Admin — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: { bhuraBlack: '#111111', bhuraWhite: '#FFFFFF', bhuraOffWhite: '#F7F7F5', bhuraLightGrey: '#EAEAEA', bhuraTextGrey: '#777777' },
            fontFamily: { sans: ['Helvetica Neue', 'Inter', 'Manrope', 'sans-serif'] },
            letterSpacing: { widest: '0.2em' }
        } } }
    </script>
</head>
<body class="bg-bhuraBlack text-bhuraWhite font-sans antialiased min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-sm">
        <div class="text-center mb-10">
            <span class="text-2xl font-black tracking-widest uppercase block">BHURA</span>
            <span class="text-[11px] font-mono uppercase tracking-widest text-bhuraTextGrey">Admin Console</span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 bg-white/5 border border-white/10 p-8">
            <div>
                <label class="block text-[10px] font-mono uppercase tracking-widest text-bhuraTextGrey mb-1">Username</label>
                <input name="username" type="text" required autocomplete="username" class="w-full bg-transparent border border-white/20 px-4 py-3 text-xs tracking-widest focus:outline-none focus:border-white">
            </div>
            <div>
                <label class="block text-[10px] font-mono uppercase tracking-widest text-bhuraTextGrey mb-1">Password</label>
                <input name="password" type="password" required autocomplete="current-password" class="w-full bg-transparent border border-white/20 px-4 py-3 text-xs tracking-widest focus:outline-none focus:border-white">
            </div>
            <p id="login-error" class="hidden text-[11px] text-red-400 uppercase tracking-wider"></p>
            <button id="login-btn" type="submit" class="w-full bg-bhuraWhite text-bhuraBlack py-3 text-xs font-semibold uppercase tracking-widest hover:bg-bhuraLightGrey transition-colors">
                Sign In
            </button>
        </form>
        <p class="text-center text-[10px] font-mono uppercase tracking-widest text-bhuraTextGrey mt-6">
            <a href="../index.html" class="hover:text-white">← Back to storefront</a>
        </p>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Signing In…';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.elements.username.value,
                        password: form.elements.password.value,
                    }),
                });
                if (!res.ok) {
                    const detail = await res.json().catch(() => ({}));
                    throw new Error(detail.detail || 'Invalid username or password');
                }
                window.location.href = 'dashboard.html';
            } catch (e) {
                errorEl.textContent = e.message;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
